version: 2
registries:
  ft-frontend-saksbehandling: # Gir tilgang til registre innad i nav med ft-frontend-saksbehandling som inngang (PATen bestemmer)
    type: maven-repository
    url: https://maven.pkg.github.com/navikt/ft-frontend-saksbehandling
    username: x-access-token
    password: ${{ secrets.READER_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: "/"
    registries:
      - ft-frontend-saksbehandling
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
      prod-major:
        dependency-type: "production"
        update-types:
          - "major"
      dev-major:
        dependency-type: "development"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
